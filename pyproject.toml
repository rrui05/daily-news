[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-news-cli"
version = "0.1.0"
description = "基于本机 Codex 实时深度检索的每日科技与市场新闻 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "rrui05" }]
dependencies = []

[project.urls]
Repository = "https://github.com/rrui05/daily-news"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.scripts]
dailynews = "dailynews.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dailynews = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
